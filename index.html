<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaan Tyagi | Shaan Digital — AI, Analytics & Lifestyle Consulting</title>
    <meta name="description" content="Shaan Tyagi - Shaan Digital. Life-changing ebooks & consulting to improve business using AI & analytics. Expert advice on shopping, gadgets, cars, and courses.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --gold-100: #f9f0d1;
            --gold-200: #f4e4bc;
            --gold-300: #e8d5a3;
            --gold-400: #d4af37;
            --gold-500: #c5a028;
            --gold-600: #b8860b;
            --gold-700: #9a7209;
            --gold-800: #7a5a06;
            --gold-900: #5c4304;
            --dark-900: #0a0a0a;
            --dark-800: #121212;
            --dark-700: #1a1a1a;
            --dark-600: #222222;
            --dark-500: #2a2a2a;
            --dark-400: #333333;
            --cream: #f5f0e8;
            --text-light: #e0ddd5;
            --text-muted: #a09a8e;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
            --shadow-gold: 0 4px 30px rgba(212, 175, 55, 0.15);
            --shadow-gold-strong: 0 8px 40px rgba(212, 175, 55, 0.25);
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* ===== Reset & Base ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--dark-900);
            color: var(--text-light);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Animated Gold Gradient Background ===== */
        .bg-gold-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 25%, #0a0a0a 50%, #1a1a1a 75%, #0a0a0a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Gold particle overlay */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--gold-400);
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 8s infinite;
            box-shadow: 0 0 6px var(--gold-400);
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 10s; }
        .particle:nth-child(2) { left: 25%; animation-delay: 2s; animation-duration: 12s; }
